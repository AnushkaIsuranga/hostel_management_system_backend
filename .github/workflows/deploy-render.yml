name: Deploy Staging to Render

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate render.yaml
        run: |
          if [ ! -f "render.yaml" ]; then
            echo "❌ render.yaml not found"
            exit 1
          fi
          echo "✅ render.yaml found"
      
      - name: Trigger Render Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "❌ RENDER_API_KEY secret not configured"
            exit 1
          fi
          
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "❌ RENDER_SERVICE_ID secret not configured"
            exit 1
          fi
          
          echo "🚀 Triggering Render deployment..."
          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "full"}')
          
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Deployment triggered successfully"
          else
            echo "❌ Failed to trigger deployment"
            exit 1
          fi
      
      - name: Monitor Deployment Status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: |
          # Wait for deployment to complete (max 30 minutes)
          TIMEOUT=1800
          START_TIME=$(date +%s)
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ $ELAPSED -gt $TIMEOUT ]; then
              echo "⏱️ Deployment monitoring timeout (30 minutes exceeded)"
              echo "Check status at: https://dashboard.render.com"
              exit 0
            fi
            
            STATUS=$(curl -s \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID" | \
              grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "unknown")
            
            echo "⏳ Status: $STATUS (${ELAPSED}s elapsed)"
            
            if [ "$STATUS" = "available" ]; then
              echo "✅ Service is available"
              break
            fi
            
            sleep 10
          done
      
      - name: Post Deployment Summary
        if: always()
        run: |
          echo "📊 Deployment Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo ""
          echo "📍 Service URL: https://staging.unihome.lk"
          echo "📋 Dashboard: https://dashboard.render.com"
          echo "📚 Docs: ./DEPLOYMENT.md"
          echo ""
          echo "🎉 Deployment workflow completed!"
